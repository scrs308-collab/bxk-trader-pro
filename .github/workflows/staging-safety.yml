name: Staging confirmation safeguards
on:
  push:
    branches: [feature/unified-trade-workbench]
    paths:
      - staging_confirmation.py
      - tests/test_staging_confirmation_safety.py
      - .github/workflows/staging-safety.yml
  workflow_dispatch:
jobs:
  safety-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install 'fastapi>=0.110,<1'
      - name: Run confirmation safeguard regression tests
        run: python -m unittest discover -s tests -p 'test_staging_confirmation_safety.py' -v
