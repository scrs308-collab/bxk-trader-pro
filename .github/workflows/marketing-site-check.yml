name: Marketing Site Check

on:
  pull_request:
    branches:
      - feature/marketing-site
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Validate marketing pages and links
        run: python marketing-site/check_site.py
