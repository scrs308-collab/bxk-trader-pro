name: Legacy security backport
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  security-and-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BXK_LIVE_TRADING_ENABLED: 'false'
      BXK_AUTH_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13.18'
      - run: |
          python -m pip install pip==26.2.2
          python -m pip install -r requirements.txt
          python -m pip install pytest==9.1.1 httpx==0.28.1
          python -m pip check
      - run: python -m pytest -q
      - run: python scripts/check_tls_trust.py --probe
      - run: |
          python -m venv /tmp/bxk-audit
          /tmp/bxk-audit/bin/python -m pip install pip-audit==2.10.1
          /tmp/bxk-audit/bin/python -m pip_audit --no-deps --disable-pip -r dependencies.constraints
