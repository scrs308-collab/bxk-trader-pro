name: BXK Test Suite

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest

      - name: Run test suite
        env:
          BXK_AUTH_ENABLED: "false"
        run: pytest -q


  migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bxk
          POSTGRES_PASSWORD: bxk_test_password
          POSTGRES_DB: bxk_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bxk -d bxk_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install migration dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Apply database migrations
        env:
          DATABASE_URL: postgresql://bxk:bxk_test_password@localhost:5432/bxk_test
        run: python -m alembic upgrade head
