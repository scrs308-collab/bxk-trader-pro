name: Dependency security
on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 11 * * 1'
permissions:
  contents: read
jobs:
  audit-and-tls:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BXK_LIVE_TRADING_ENABLED: 'false'
      BXK_PREVIEW_MODE: 'true'
      BXK_AUTH_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13.18'
      - name: Install constrained application and test tools
        run: |
          python -m pip install 'pip @ https://files.pythonhosted.org/packages/3f/06/3e4420302363fbb71be3c7f35ce042f54bfca330e3e66b3a2e3c4cca579f/pip-26.2.2-py3-none-any.whl#sha256=fd7f4dfa8190e014013b9f08f3e973f4e4c26ffd179a204895533a7254813a70'
          python -m pip install -r requirements.txt
          python -m pip install pytest==9.1.1 httpx==0.28.1
          python -m pip check
      - name: Inspect TLS stores and reject untrusted certificate
        run: |
          python scripts/check_tls_trust.py
          python -m pytest -q tests/test_tls_trust.py tests/test_order_safety.py tests/test_preview_mode.py tests/test_no_committed_secrets.py
      - name: Reject published compromised certificate chains
        run: python scripts/check_tls_trust.py --probe
      - name: Install audit tool separately
        run: |
          python -m venv /tmp/bxk-audit
          /tmp/bxk-audit/bin/python -m pip install pip-audit==2.10.1
      - name: Audit exact application constraints
        run: /tmp/bxk-audit/bin/python -m pip_audit --no-deps --disable-pip -r dependencies.constraints --format json -o dependency-audit.json
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: dependency-audit
          path: dependency-audit.json
