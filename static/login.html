<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >
  <title>BXK Trader Pro - Sign In</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: Arial, Helvetica, sans-serif;
      color: #e5e7eb;
      background:
        radial-gradient(
          circle at top,
          #172554,
          #020617 60%
        );
    }

    .login-card {
      width: min(420px, 100%);
      padding: 32px;
      border: 1px solid #334155;
      border-radius: 16px;
      background: #0f172a;
      box-shadow:
        0 25px 60px rgba(0, 0, 0, 0.45);
    }

    .brand {
      text-align: center;
      margin-bottom: 28px;
    }

    .logo {
      width: 64px;
      height: 64px;
      display: grid;
      place-items: center;
      margin: 0 auto 14px;
      border: 1px solid #3b82f6;
      border-radius: 14px;
      background: #172554;
      font-size: 20px;
      font-weight: 900;
    }

    h1 {
      margin: 0;
      font-size: 24px;
    }

    .subtitle {
      margin-top: 7px;
      color: #94a3b8;
      font-size: 13px;
    }

    label {
      display: block;
      margin-bottom: 18px;
    }

    label span {
      display: block;
      margin-bottom: 7px;
      font-size: 13px;
      font-weight: 700;
    }

    input {
      width: 100%;
      padding: 12px 13px;
      border: 1px solid #475569;
      border-radius: 8px;
      background: #020617;
      color: white;
      font-size: 15px;
    }

    input:focus {
      border-color: #60a5fa;
      outline: none;
    }

    button {
      width: 100%;
      padding: 13px;
      border: 1px solid #60a5fa;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      font-weight: 800;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.55;
    }

    #status {
      min-height: 22px;
      margin-top: 17px;
      text-align: center;
      color: #94a3b8;
      font-size: 13px;
    }

    #status.error {
      color: #fca5a5;
    }
  </style>
</head>

<body>
  <main class="login-card">
    <div class="brand">
      <div class="logo">BXK</div>

      <h1>BXK Trader Pro</h1>

      <div class="subtitle">
        Secure Trading Console
      </div>
    </div>

    <form id="loginForm">
      <label>
        <span>Username</span>
        <input
          id="username"
          type="text"
          autocomplete="username"
          required
          autofocus
        >
      </label>

      <label>
        <span>Password</span>
        <input
          id="password"
          type="password"
          autocomplete="current-password"
          required
        >
      </label>

      <button
        id="loginButton"
        type="submit"
      >
        SIGN IN
      </button>
    </form>

    <div id="status"></div>
  </main>

  <script>
    const form =
      document.getElementById("loginForm");

    const button =
      document.getElementById("loginButton");

    const statusElement =
      document.getElementById("status");

    form.addEventListener(
      "submit",
      async (event) => {
        event.preventDefault();

        const username =
          document
            .getElementById("username")
            .value
            .trim();

        const password =
          document
            .getElementById("password")
            .value;

        button.disabled = true;
        button.textContent = "SIGNING IN...";

        statusElement.className = "";
        statusElement.textContent =
          "Verifying credentials...";

        try {
          const response =
            await fetch(
              "/api/auth/login",
              {
                method: "POST",
                headers: {
                  "Content-Type":
                    "application/json"
                },
                body: JSON.stringify({
                  username,
                  password
                })
              }
            );

          const data =
            await response.json();

          if (!response.ok) {
            throw new Error(
              data.detail ||
              "Authentication failed."
            );
          }

          document.getElementById(
            "password"
          ).value = "";

          window.location.replace("/");

        } catch (error) {
          document.getElementById(
            "password"
          ).value = "";

          statusElement.className =
            "error";

          statusElement.textContent =
            error.message;

          button.disabled = false;
          button.textContent =
            "SIGN IN";
        }
      }
    );
  </script>
</body>
</html>
