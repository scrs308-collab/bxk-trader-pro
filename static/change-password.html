<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>BXK Trader Pro - Change Password</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: Arial, Helvetica, sans-serif;
      color: #e5e7eb;
      background:
        radial-gradient(
          circle at top,
          #172554,
          #020617 60%
        );
    }

    .login-card {
      width: min(420px, 100%);
      padding: 32px;
      border: 1px solid #334155;
      border-radius: 16px;
      background: #0f172a;
      box-shadow:
        0 25px 60px rgba(0, 0, 0, 0.45);
    }

    .brand {
      text-align: center;
      margin-bottom: 28px;
    }

    .logo {
      width: 64px;
      height: 64px;
      display: grid;
      place-items: center;
      margin: 0 auto 14px;
      border: 1px solid #3b82f6;
      border-radius: 14px;
      background: #172554;
      font-size: 20px;
      font-weight: 900;
    }

    h1 {
      margin: 0;
      font-size: 24px;
    }

    .subtitle {
      margin-top: 7px;
      color: #94a3b8;
      font-size: 13px;
      line-height: 1.5;
    }

    label {
      display: block;
      margin-bottom: 18px;
    }

    label span {
      display: block;
      margin-bottom: 7px;
      font-size: 13px;
      font-weight: 700;
    }

    input {
      width: 100%;
      padding: 12px 13px;
      border: 1px solid #475569;
      border-radius: 8px;
      background: #020617;
      color: white;
      font-size: 15px;
    }

    input:focus {
      border-color: #60a5fa;
      outline: none;
    }

    button {
      width: 100%;
      padding: 13px;
      border: 1px solid #60a5fa;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      font-weight: 800;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.55;
    }

    .secondary-button {
      margin-top: 10px;
      border-color: #475569;
      background: transparent;
      color: #94a3b8;
    }

    #status {
      min-height: 22px;
      margin-top: 17px;
      text-align: center;
      color: #94a3b8;
      font-size: 13px;
    }

    #status.error {
      color: #fca5a5;
    }

    #status.success {
      color: #86efac;
    }

    .password-note {
      margin: -8px 0 18px;
      color: #94a3b8;
      font-size: 12px;
      line-height: 1.45;
    }
  </style>
</head>

<body>
  <main class="login-card">
    <div class="brand">
      <div class="logo">BXK</div>

      <h1>Change Password</h1>

      <div class="subtitle">
        Your temporary password must be replaced
        before accessing BXK Trader Pro.
      </div>
    </div>

    <form id="changePasswordForm">

      <label>
        <span>Current Password</span>

        <input
          id="currentPassword"
          type="password"
          autocomplete="current-password"
          required
          autofocus
        >
      </label>

      <label>
        <span>New Password</span>

        <input
          id="newPassword"
          type="password"
          autocomplete="new-password"
          minlength="8"
          required
        >
      </label>

      <label>
        <span>Confirm New Password</span>

        <input
          id="confirmPassword"
          type="password"
          autocomplete="new-password"
          minlength="8"
          required
        >
      </label>

      <div class="password-note">
        Password must contain at least 8 characters.
      </div>

      <button
        id="changeButton"
        type="submit"
      >
        CHANGE PASSWORD
      </button>

    </form>

    <button
      id="logoutButton"
      class="secondary-button"
      type="button"
    >
      SIGN OUT
    </button>

    <div id="status"></div>
  </main>

  <script>
    const form =
      document.getElementById(
        "changePasswordForm"
      );

    const changeButton =
      document.getElementById(
        "changeButton"
      );

    const logoutButton =
      document.getElementById(
        "logoutButton"
      );

    const statusElement =
      document.getElementById(
        "status"
      );


    async function verifySession() {
      try {
        const response = await fetch(
          "/api/auth/status",
          {
            cache: "no-store"
          }
        );

        const data = await response.json();

        if (!data.authenticated) {
          window.location.replace("/login");
          return;
        }

        if (
          data.must_change_password !== true
        ) {
          window.location.replace("/");
        }

      } catch (error) {
        statusElement.className = "error";
        statusElement.textContent =
          "Could not verify your session.";
      }
    }


    form.addEventListener(
      "submit",
      async (event) => {
        event.preventDefault();

        const currentPassword =
          document.getElementById(
            "currentPassword"
          ).value;

        const newPassword =
          document.getElementById(
            "newPassword"
          ).value;

        const confirmPassword =
          document.getElementById(
            "confirmPassword"
          ).value;

        statusElement.className = "";

        if (
          newPassword !== confirmPassword
        ) {
          statusElement.className =
            "error";

          statusElement.textContent =
            "New passwords do not match.";

          return;
        }

        if (newPassword.length < 8) {
          statusElement.className =
            "error";

          statusElement.textContent =
            "Password must be at least 8 characters.";

          return;
        }

        changeButton.disabled = true;
        changeButton.textContent =
          "CHANGING PASSWORD...";

        statusElement.textContent =
          "Updating password...";

        try {
          const response = await fetch(
            "/api/auth/change-password",
            {
              method: "POST",
              headers: {
                "Content-Type":
                  "application/json"
              },
              body: JSON.stringify({
                current_password:
                  currentPassword,
                new_password:
                  newPassword
              })
            }
          );

          const data =
            await response.json();

          if (!response.ok) {
            throw new Error(
              data.detail ||
              "Password change failed."
            );
          }

          statusElement.className =
            "success";

          statusElement.textContent =
            "Password changed successfully.";

          document.getElementById(
            "currentPassword"
          ).value = "";

          document.getElementById(
            "newPassword"
          ).value = "";

          document.getElementById(
            "confirmPassword"
          ).value = "";

          window.location.replace("/");

        } catch (error) {
          statusElement.className =
            "error";

          statusElement.textContent =
            error.message;

          changeButton.disabled = false;
          changeButton.textContent =
            "CHANGE PASSWORD";
        }
      }
    );


    logoutButton.addEventListener(
      "click",
      async () => {
        try {
          await fetch(
            "/api/auth/logout",
            {
              method: "POST"
            }
          );
        } finally {
          window.location.replace(
            "/login"
          );
        }
      }
    );


    verifySession();
  </script>
</body>
</html>
