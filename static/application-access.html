<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >
  <title>BXK Trader Pro - Application Access</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #020817;
      color: #f8fafc;
      font-family: Arial, sans-serif;
    }

    .card {
      width: min(520px, calc(100vw - 32px));
      background: #111827;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 34px;
      text-align: center;
    }

    .logo {
      width: 64px;
      height: 64px;
      margin: 0 auto 18px;
      display: grid;
      place-items: center;
      border: 1px solid #3b82f6;
      border-radius: 14px;
      font-weight: 900;
      font-size: 20px;
    }

    h1 {
      margin-bottom: 10px;
    }

    p {
      color: #cbd5e1;
      line-height: 1.6;
    }

    .status {
      margin: 24px 0;
      padding: 16px;
      border: 1px solid #334155;
      border-radius: 10px;
      background: #0f172a;
    }

    a {
      color: #60a5fa;
      text-decoration: none;
    }
  </style>
</head>

<body>
  <main class="card">
    <div class="logo">BXK</div>

    <h1>Application Access</h1>

    <p>
      BXK Trader Pro accounts are currently
      issued by approval only.
    </p>

    <div class="status">
      The online account application is being
      prepared. This page will become the BXK
      Trader Pro application and approval portal.
    </div>

    <a href="/login">
      Return to Sign In
    </a>
  </main>
</body>
</html>
