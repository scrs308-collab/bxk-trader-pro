<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >
  <title>SMS Alerts | BXK Trader Pro</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: #0b1220;
      color: #e5e7eb;
      font-family:
        Arial,
        Helvetica,
        sans-serif;
      line-height: 1.55;
    }

    .card {
      width: min(620px, 100%);
      padding: 32px;
      border: 1px solid #334155;
      border-radius: 16px;
      background: #0f172a;
      box-shadow:
        0 25px 60px
        rgba(0, 0, 0, 0.45);
    }

    .brand {
      color: #94a3b8;
      font-size: 13px;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    h1 {
      margin-bottom: 8px;
      color: #ffffff;
    }

    .intro {
      color: #cbd5e1;
      margin-bottom: 26px;
    }

    label.phone-label {
      display: block;
      margin-bottom: 22px;
    }

    label.phone-label span {
      display: block;
      margin-bottom: 8px;
      font-weight: 700;
    }

    input[type="tel"] {
      width: 100%;
      padding: 13px 14px;
      border: 1px solid #475569;
      border-radius: 8px;
      background: #020617;
      color: #ffffff;
      font-size: 16px;
    }

    .consent-box {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 18px;
      border: 1px solid #475569;
      border-radius: 10px;
      background: #111827;
    }

    .consent-box input {
      width: 20px;
      height: 20px;
      margin-top: 3px;
      flex: 0 0 auto;
    }

    .consent-text {
      font-size: 14px;
      color: #d1d5db;
    }

    a {
      color: #60a5fa;
    }

    button {
      width: 100%;
      margin-top: 24px;
      padding: 14px;
      border: 0;
      border-radius: 9px;
      background: #2563eb;
      color: white;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
    }

    button:disabled {
      opacity: .55;
      cursor: not-allowed;
    }

    #status {
      margin-top: 18px;
      min-height: 24px;
      font-size: 14px;
    }

    .success {
      color: #86efac;
    }

    .error {
      color: #fca5a5;
    }

    .legal {
      margin-top: 24px;
      padding-top: 18px;
      border-top: 1px solid #334155;
      text-align: center;
      font-size: 13px;
      color: #94a3b8;
    }
  </style>
</head>

<body>
  <main class="card">
    <div class="brand">
      BXK Trader Pro
    </div>

    <h1>
      SMS Trading-Risk Alerts
    </h1>

    <p class="intro">
      Authorized BXK Trader Pro users may
      voluntarily enroll in transactional SMS
      notifications for monitored trading-risk
      conditions.
    </p>

    <form id="smsOptInForm">
      <label class="phone-label">
        <span>Mobile Phone Number</span>

        <input
          id="phoneNumber"
          name="phoneNumber"
          type="tel"
          autocomplete="tel"
          placeholder="(252) 555-1234"
          required
        >
      </label>

      <label class="consent-box">
        <input
          id="consentCheckbox"
          name="consent"
          type="checkbox"
          required
        >

        <span class="consent-text">
          By checking this box, I agree to receive
          recurring transactional SMS alerts from
          BXK Trader Pro regarding monitored trading
          positions, overnight risk changes, and
          recovery notifications. Message frequency
          varies. Message and data rates may apply.
          Reply STOP to opt out and HELP for help.
          SMS consent is optional and is not required
          to use BXK Trader Pro.
          <a href="/privacy">
            Privacy Policy
          </a>
          and
          <a href="/terms">
            Terms &amp; Conditions
          </a>.
        </span>
      </label>

      <button
        id="submitButton"
        type="submit"
      >
        ENABLE SMS ALERTS
      </button>
    </form>

    <div id="status"></div>

    <div class="legal">
      No marketing or promotional SMS messages
      are sent. Mobile opt-in information is not
      shared for marketing purposes.
    </div>
  </main>

  <script>
    const form =
      document.getElementById(
        "smsOptInForm"
      );

    const button =
      document.getElementById(
        "submitButton"
      );

    const statusElement =
      document.getElementById(
        "status"
      );

    form.addEventListener(
      "submit",
      async (event) => {
        event.preventDefault();

        const phoneNumber =
          document.getElementById(
            "phoneNumber"
          ).value;

        const consent =
          document.getElementById(
            "consentCheckbox"
          ).checked;

        statusElement.className = "";
        statusElement.textContent = "";
        button.disabled = true;
        button.textContent =
          "RECORDING CONSENT...";

        try {
          const response = await fetch(
            "/api/sms/opt-in",
            {
              method: "POST",
              headers: {
                "Content-Type":
                  "application/json"
              },
              body: JSON.stringify({
                phone_number:
                  phoneNumber,
                consent
              })
            }
          );

          const result =
            await response.json();

          if (!response.ok) {
            throw new Error(
              result.detail ||
              "Unable to record SMS consent."
            );
          }

          statusElement.className =
            "success";

          statusElement.textContent =
            "SMS consent recorded successfully.";

          button.textContent =
            "SMS ALERTS ENABLED";

        } catch (error) {
          statusElement.className =
            "error";

          statusElement.textContent =
            error.message;

          button.disabled = false;
          button.textContent =
            "ENABLE SMS ALERTS";
        }
      }
    );
  </script>
</body>
</html>
