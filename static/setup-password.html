<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <title>BXK Trader Pro - Set Your Password</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: Arial, Helvetica, sans-serif;
      color: #e5e7eb;
      background:
        radial-gradient(
          circle at top,
          #172554,
          #020617 60%
        );
    }

    .login-card {
      width: min(420px, 100%);
      padding: 32px;
      border: 1px solid #334155;
      border-radius: 16px;
      background: #0f172a;
      box-shadow:
        0 25px 60px rgba(0, 0, 0, 0.45);
    }

    .brand {
      text-align: center;
      margin-bottom: 28px;
    }

    .logo {
      width: 64px;
      height: 64px;
      display: grid;
      place-items: center;
      margin: 0 auto 14px;
      border: 1px solid #3b82f6;
      border-radius: 14px;
      background: #172554;
      font-size: 20px;
      font-weight: 900;
    }

    h1 {
      margin: 0;
      font-size: 24px;
    }

    .subtitle {
      margin-top: 7px;
      color: #94a3b8;
      font-size: 13px;
      line-height: 1.5;
    }

    label {
      display: block;
      margin-bottom: 18px;
    }

    label span {
      display: block;
      margin-bottom: 7px;
      font-size: 13px;
      font-weight: 700;
    }

    input {
      width: 100%;
      padding: 12px 13px;
      border: 1px solid #475569;
      border-radius: 8px;
      background: #020617;
      color: white;
      font-size: 15px;
    }

    input:focus {
      border-color: #60a5fa;
      outline: none;
    }

    button {
      width: 100%;
      padding: 13px;
      border: 1px solid #60a5fa;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      font-weight: 800;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.55;
    }

    .secondary-button {
      margin-top: 10px;
      border-color: #475569;
      background: transparent;
      color: #94a3b8;
    }

    #status {
      min-height: 22px;
      margin-top: 17px;
      text-align: center;
      color: #94a3b8;
      font-size: 13px;
    }

    #status.error {
      color: #fca5a5;
    }

    #status.success {
      color: #86efac;
    }

    .password-note {
      margin: -8px 0 18px;
      color: #94a3b8;
      font-size: 12px;
      line-height: 1.45;
    }

    [hidden] { display: none !important; }
    .login-link { display: block; margin-top: 20px; color: #93c5fd; text-align: center; }
  </style>
</head>
<body>
  <main class="login-card">
    <div class="brand">
      <div class="logo">BXK</div>
      <h1>Set Your Password</h1>
      <div class="subtitle">
        Choose a password for your BXK Trader Pro account.
        This setup link can only be used once.
      </div>
    </div>

    <form id="setupPasswordForm" hidden>
      <label>
        <span>New Password</span>
        <input id="newPassword" type="password" autocomplete="new-password"
          minlength="8" maxlength="1024" required>
      </label>
      <label>
        <span>Confirm New Password</span>
        <input id="confirmPassword" type="password" autocomplete="new-password"
          minlength="8" maxlength="1024" required>
      </label>
      <div class="password-note">Password must contain at least 8 characters.</div>
      <button id="setupButton" type="submit">SET PASSWORD</button>
    </form>

    <div id="status" role="status" aria-live="polite"></div>
    <a id="loginLink" class="login-link" href="/login">Go to sign in</a>
    <noscript>JavaScript is required to use this secure setup link.</noscript>
  </main>

  <script>
    (() => {
      "use strict";

      // The secret is read only from the fragment, which is never sent to the server.
      // Remove both fragment and query immediately; never keep secrets in browser storage.
      let setupToken = "";
      try {
        const values = new URLSearchParams(window.location.hash.slice(1)).getAll("token");
        if (values.length === 1 && values[0].length > 0 && values[0].length <= 512) {
          setupToken = values[0];
        }
        window.history.replaceState(null, "", window.location.pathname);
      } catch (_) {
        // Fail closed when the URL cannot be cleaned safely.
        setupToken = "";
      }

      const form = document.getElementById("setupPasswordForm");
      const button = document.getElementById("setupButton");
      const password = document.getElementById("newPassword");
      const confirmation = document.getElementById("confirmPassword");
      const status = document.getElementById("status");
      const loginLink = document.getElementById("loginLink");
      let submitting = false;
      let finished = false;
      const invalidMessage = "This setup link is invalid or expired. Ask the owner for a new link.";

      function clearPasswords() {
        password.value = "";
        confirmation.value = "";
      }

      function invalidateLink() {
        setupToken = "";
        clearPasswords();
        form.hidden = true;
        button.disabled = true;
        status.className = "error";
        status.textContent = invalidMessage;
      }

      if (setupToken) {
        form.hidden = false;
      } else {
        invalidateLink();
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        if (submitting || finished || !setupToken) return;
        status.className = "error";
        if (password.value.length < 8) {
          status.textContent = "Password must be at least 8 characters.";
          return;
        }
        if (password.value.length > 1024) {
          status.textContent = "Password must be no more than 1024 characters.";
          return;
        }
        if (password.value !== confirmation.value) {
          status.textContent = "New passwords do not match.";
          return;
        }

        submitting = true;
        button.disabled = true;
        password.disabled = true;
        confirmation.disabled = true;
        button.textContent = "SETTING PASSWORD...";
        status.className = "";
        status.textContent = "Setting your password...";

        try {
          const response = await fetch("/api/auth/setup-password", {
            method: "POST",
            credentials: "omit",
            cache: "no-store",
            referrerPolicy: "no-referrer",
            redirect: "error",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ token: setupToken, new_password: password.value }),
          });
          const data = await response.json();

          if (!response.ok) {
            if (data.code === "INVALID_SETUP_LINK") {
              invalidateLink();
              return;
            }
            clearPasswords();
            status.className = "error";
            status.textContent = data.code === "INVALID_PASSWORD"
              ? "Choose a password with 8 to 1024 characters, then try again."
              : "Could not set your password. Please try again in a moment.";
            return;
          }

          if (data.password_set !== true) {
            throw new Error("Password setup result was incomplete.");
          }
          setupToken = "";
          clearPasswords();
          finished = true;
          form.hidden = true;
          status.className = "success";
          status.textContent = "Password set. Sign in with your username and new password.";
          loginLink.textContent = "Sign in to BXK Trader Pro";
          loginLink.focus();
        } catch (_) {
          clearPasswords();
          status.className = "error";
          status.textContent = "Could not confirm your password was set. Try again, or sign in if it already succeeded.";
        } finally {
          submitting = false;
          button.disabled = finished || !setupToken;
          password.disabled = finished || !setupToken;
          confirmation.disabled = finished || !setupToken;
          button.textContent = "SET PASSWORD";
        }
      });

      // Back/Forward restoration must not revive a used or abandoned secret.
      window.addEventListener("pagehide", () => {
        invalidateLink();
        finished = true;
      });
    })();
  </script>
</body>
</html>
