<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >
  <title>BXK Trader Pro - Password Reset</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #020817;
      color: #f8fafc;
      font-family: Arial, sans-serif;
    }

    .card {
      width: min(430px, calc(100vw - 32px));
      background: #111827;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 32px;
    }

    h1 {
      margin: 0 0 8px;
      text-align: center;
    }

    .subtitle {
      color: #94a3b8;
      text-align: center;
      margin-bottom: 28px;
    }

    label {
      display: block;
      margin-bottom: 18px;
      font-weight: 700;
      font-size: 13px;
    }

    input {
      width: 100%;
      margin-top: 8px;
      padding: 13px;
      border: 1px solid #64748b;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 13px;
      border: 0;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      font-weight: 800;
      cursor: pointer;
    }

    #status {
      margin-top: 18px;
      color: #cbd5e1;
      line-height: 1.45;
      font-size: 13px;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #60a5fa;
      text-decoration: none;
    }
  </style>
</head>

<body>
  <main class="card">
    <h1>Forgot Password</h1>

    <div class="subtitle">
      BXK Trader Pro
    </div>

    <form id="resetForm">
      <label>
        Username or Account Email

        <input
          id="identity"
          type="text"
          autocomplete="username"
          required
          autofocus
        >
      </label>

      <button
        id="resetButton"
        type="submit"
      >
        EMAIL TEMPORARY PASSWORD
      </button>
    </form>

    <div id="status"></div>

    <a class="back" href="/login">
      Back to Sign In
    </a>
  </main>

  <script>
    const form =
      document.getElementById("resetForm");

    const button =
      document.getElementById("resetButton");

    const statusElement =
      document.getElementById("status");

    form.addEventListener(
      "submit",
      async (event) => {
        event.preventDefault();

        button.disabled = true;
        button.textContent = "SENDING...";

        try {
          const response = await fetch(
            "/api/auth/forgot-password",
            {
              method: "POST",
              headers: {
                "Content-Type":
                  "application/json"
              },
              body: JSON.stringify({
                identity:
                  document
                    .getElementById("identity")
                    .value
                    .trim()
              })
            }
          );

          const data =
            await response.json();

          statusElement.textContent =
            data.message ||
            "If the account matches, a temporary password will be emailed.";

        } catch (error) {
          statusElement.textContent =
            "Unable to process the request right now.";
        } finally {
          button.disabled = false;
          button.textContent =
            "EMAIL TEMPORARY PASSWORD";
        }
      }
    );
  </script>
</body>
</html>
